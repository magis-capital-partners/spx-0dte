name: Deploy dashboard to GitHub Pages

# Publishes dashboard/ to GitHub Pages (same pattern as magis-capital-partners/etf-dashboard).
# Source must be "GitHub Actions" under Settings → Pages — not "Deploy from branch".
#
# dashboard/data/dashboard_data.json is committed from local backtest runs
# (run_profiles.ps1 → build_dashboard_data.py). This workflow only deploys.

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - id: deployment
        uses: actions/deploy-pages@v4
