<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SPX 0DTE Strategy Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  :root {
    --bg:#0b0f17; --panel:#131a26; --panel2:#1a2434; --ink:#e6edf6; --muted:#8aa0bd;
    --line:#243245; --green:#3fb950; --red:#f85149; --blue:#58a6ff;
    --amber:#d29922; --violet:#bc8cff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; font-weight:650; }
  .sub { color:var(--muted); font-size:12px; }
  .tabs { display:flex; gap:4px; padding:0 24px; border-bottom:1px solid var(--line); }
  .tab { padding:10px 16px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; }
  .tab.active { color:var(--ink); border-bottom-color:var(--blue); }
  main { padding:24px; max-width:1280px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card .k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .card .k.greek, th.greek, .greek-label { text-transform:none; letter-spacing:0; }
  .greek { font-family:"Cambria Math","Segoe UI Symbol","Times New Roman",serif; font-style:normal; font-weight:600; }
  sub { font-size:0.72em; font-weight:500; opacity:0.9; }
  .card .v { font-size:22px; font-weight:650; margin-top:6px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:20px; }
  .panel h2 { font-size:14px; margin:0 0 14px; font-weight:600; }
  .panel h2.greek-label { text-transform:none; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:right; padding:7px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:500; font-size:11px; text-transform:uppercase; cursor:pointer; }
  tr:hover td { background:var(--panel2); }
  .pos { color:var(--green); } .neg { color:var(--red); }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px; background:var(--panel2); color:var(--muted); }
  .pill.halt { background:rgba(248,81,73,.15); color:var(--red); }
  select, input { background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .swatch { width:11px; height:11px; border-radius:3px; display:inline-block; }
  .muted { color:var(--muted); }
  .big { font-size:26px; font-weight:680; }
  a { color:var(--blue); }
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card { width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px 26px; }
  .login-field { margin-bottom:14px; }
  .login-field label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:5px; }
  .login-field input { width:100%; }
  .login-btn { width:100%; margin-top:8px; padding:10px; border-radius:8px; border:none; background:var(--blue); color:#fff; font-weight:650; cursor:pointer; }
  .login-btn:disabled { opacity:.55; cursor:not-allowed; }
  .login-error { margin-top:12px; color:var(--red); font-size:12px; }
  .guide h3 { font-size:15px; margin:20px 0 8px; font-weight:600; }
  .guide h3:first-child { margin-top:0; }
  .guide p { margin:0 0 10px; color:var(--ink); line-height:1.55; }
  .guide ul { margin:0 0 12px 18px; padding:0; color:var(--ink); line-height:1.55; }
  .guide li { margin-bottom:6px; }
  .guide-head { margin-bottom:16px; }
  .guide-head .lead { font-size:15px; margin:8px 0 0; color:var(--muted); }
  .result-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin-top:14px; }
  .result-grid .card .v { font-size:17px; }
  .console {
    background:#0a0e14; border:1px solid var(--line); border-radius:8px; padding:12px 14px;
    font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:#c8d1dc;
    max-height:280px; overflow:auto; white-space:pre-wrap; word-break:break-word;
  }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
  .dot.on { background:var(--green); box-shadow:0 0 0 3px rgba(63,185,80,.2); }
  .dot.off { background:var(--muted); }
  .dot.warn { background:var(--amber); }
  .dot.bad { background:var(--red); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const COLORS = ["#58a6ff","#3fb950","#bc8cff","#d29922","#f85149","#56d4dd"];
const fmt$ = (n) => (n<0?"-$":"$") + Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:0});
const fmtPct = (n,d=2) => (n==null||isNaN(n)?"–":n.toFixed(d)+"%");
const cls = (n) => n>0?"pos":n<0?"neg":"";
const MISSING = "\u2014";
const executionLabel = (value) => ({paper:"Paper trading",dry_run:"Dry run",production_live:"Production live"}[value] || "Unknown");

const LOCAL_STATUS = "http://127.0.0.1:8765";
// Cloud path B: gist raw URL from live_status_url.json (not same-origin Pages).
let CLOUD_STATUS_URL = null;
let cloudStatusUrlPromise = null;

function loadCloudStatusUrl() {
  if (CLOUD_STATUS_URL) return Promise.resolve(CLOUD_STATUS_URL);
  if (cloudStatusUrlPromise) return cloudStatusUrlPromise;
  cloudStatusUrlPromise = fetch("data/live_status_url.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if (j && j.url) CLOUD_STATUS_URL = j.url;
      return CLOUD_STATUS_URL;
    })
    .catch(() => null);
  return cloudStatusUrlPromise;
}

function fetchCloudStatus() {
  return loadCloudStatusUrl().then(url => {
    const primary = url
      ? fetch(url, { cache: "no-store", mode: "cors" }).then(r => r.ok ? r.json() : null)
      : Promise.resolve(null);
    return primary.catch(() => null).then(j => {
      if (j) return j;
      // Local serve / offline fallback when gist is unset or unreachable.
      return fetch("data/live_status.json", { cache: "no-store" })
        .then(r => r.ok ? r.json() : null)
        .catch(() => null);
    });
  });
}

function ageLabel(ts) {
  if (!ts) return "–";
  const ms = Date.now() - new Date(ts).getTime();
  if (isNaN(ms)) return "–";
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  return Math.round(s / 3600) + "h ago";
}

// Reference taxonomy for console/event reasons. Mirrors the tables in README.md
// ("Entry block & rejection reasons"); keep the two in sync.
const REASON_GROUPS = [
  {
    title: "Quote / market quality",
    note: "Re-checked on every poll while an order works, so a working entry can still be pulled.",
    rows: [
      ["quote_desync", "Legs' quote timestamps >1.0s apart — credit would be stitched from non-simultaneous quotes. Common right after the open."],
      ["stale_quote", "A leg's quote older than 5s."],
      ["stale_spot", "SPX spot tick older than 5s."],
      ["signal_expired", "Signal snapshot older than 75s at submit."],
      ["spot_drift", "SPX moved >8pt (or >0.15%) from the strike-selection reference."],
      ["credit_deterioration", "Credit fell below 80% of, or >$0.50 from, the reference credit."],
      ["short_delta_out_of_range", "Short delta outside the 0.15–0.25 band."],
      ["short_delta_drift", "Short delta moved >0.05 from the reference."],
      ["short_quote_wide", "Short-leg bid/ask wider than $0.50."],
      ["long_quote_wide", "Long-leg bid/ask wider than $0.30."],
      ["insufficient_credit", "Natural credit below the $0.20 floor."],
    ],
  },
  {
    title: "Order lifecycle",
    rows: [
      ["entry_unfilled", "Worked the full 870s without filling; cancelled."],
      ["entry_terminal_*", "IB moved the order to a terminal status (Cancelled / ApiCancelled)."],
      ["entry_working", "Tranche skipped — an entry from a prior tranche was still working."],
    ],
  },
  {
    title: "Risk governors",
    note: "Book-level caps. These block new entries; open positions keep being managed.",
    rows: [
      ["side_stop_cooldown", "That side stopped within the last 120 min."],
      ["side_stop_limit / day_stop_limit", "Hit 2 stops on a side / 4 stops on the day."],
      ["side_mtm_halt", "That side is halted on mark-to-market loss."],
      ["adverse_sequence_brake", "Consecutive-adverse-outcome brake active."],
      ["max_open_contracts", "Would exceed 48 open contracts book-wide."],
      ["max_open_per_side", "Would exceed 36 open contracts on that side."],
      ["max_open_same_strike", "Would exceed the same-strike cap (12x current sell size)."],
      ["max_open_side_cluster", "Would exceed 24 contracts within a 25pt strike cluster."],
      ["post_stop_thin_credit", "Credit-to-width too thin for a post-stop re-entry."],
    ],
  },
  {
    title: "Session halts",
    note: "halt_entries stops new entries only and never closes positions; flatten closes the book.",
    rows: [
      ["daily_loss_limit", "-2.25% MTM — halt new entries."],
      ["flatten_loss_limit", "-3.25% MTM — close everything."],
      ["stale_quotes", "3 consecutive polls with short-leg quote age >20s — halt only."],
      ["mark_unavailable", "Missing marks on open risk (60s → flatten)."],
      ["account_guard", "IB NetLiq below 90% of configured equity."],
      ["ib_disconnected", "Disconnect breaker; reconnects with backoff, re-arms native STPs."],
      ["kill_switch", "data/live/KILL present — confirmed flatten, then exit."],
    ],
  },
];

function ReasonReference() {
  const [open, setOpen] = useState(false);
  return (
    <div className="panel">
      <h2 style={{cursor:"pointer", margin:0}} onClick={()=>setOpen(o=>!o)}>
        Entry block &amp; rejection reasons
        <span className="pill" style={{marginLeft:10}}>{open ? "hide" : "show"}</span>
      </h2>
      {open && (
        <div style={{marginTop:14}}>
          <p className="sub" style={{margin:"0 0 14px"}}>
            These are named guards declining a specific trade — routine operating output, not faults.
            {" "}<code>policy=N</code> in a tranche line is the sized contract count for that tranche, not an error code.
          </p>
          {REASON_GROUPS.map((g,gi)=>(
            <div key={gi} style={{marginBottom:16}}>
              <div className="muted" style={{marginBottom:6, fontSize:11, textTransform:"uppercase"}}>{g.title}</div>
              {g.note && <p className="sub" style={{margin:"0 0 8px"}}>{g.note}</p>}
              <table><thead><tr><th style={{width:"32%"}}>Reason</th><th>Meaning</th></tr></thead>
                <tbody>{g.rows.map((r,ri)=><tr key={ri}><td><code>{r[0]}</code></td><td>{r[1]}</td></tr>)}</tbody>
              </table>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function SessionNow() {
  const [local, setLocal] = useState(null);
  const [cloud, setCloud] = useState(null);
  const [logs, setLogs] = useState([]);
  const [localErr, setLocalErr] = useState(null);
  const logRef = React.useRef(null);
  const isHttpsPage = typeof location !== "undefined" && location.protocol === "https:";

  useEffect(() => {
    let cancelled = false;
    const tick = () => {
      // From HTTPS Pages, Chromium may block loopback until Private Network Access
      // is allowed; always also load same-origin cloud status.
      fetch(LOCAL_STATUS + "/status", { cache: "no-store", mode: "cors" })
        .then(r => { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
        .then(j => { if (!cancelled) { setLocal(j); setLocalErr(null); } })
        .catch(e => { if (!cancelled) { setLocal(null); setLocalErr(String(e.message || e)); } });
      fetch(LOCAL_STATUS + "/logs?tail=120", { cache: "no-store", mode: "cors" })
        .then(r => r.ok ? r.json() : null)
        .then(j => { if (!cancelled && j?.lines) setLogs(j.lines); })
        .catch(() => {});
      fetchCloudStatus()
        .then(j => { if (!cancelled) setCloud(j); })
        .catch(() => { if (!cancelled) setCloud(null); });
    };
    tick();
    const id = setInterval(tick, 3000);
    return () => { cancelled = true; clearInterval(id); };
  }, []);

  useEffect(() => {
    if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
  }, [logs]);

  // On github.io, any response from the *viewer's* loopback can look like
  // "local live" even when it is a hollow/unrelated Status API. Only trust
  // loopback there when an executor is actually alive; otherwise use cloud.
  const trustLocal = !!local && (!isHttpsPage || !!local.pid_alive);
  const usingLocal = trustLocal;
  const src = trustLocal ? local : (cloud || local);
  const showConsole = trustLocal;
  const alive = !!(src && src.pid_alive);
  const halted = !!(src && src.entries_halted);
  const flat = !!(src && src.flattened);
  const risk = (src && src.risk) || {};
  const riskHistory = (src && src.risk_history) || [];
  const riskAvailable = risk.defined_risk_margin != null;
  let dot = "off";
  if (src && alive && !halted) dot = "on";
  else if (src && alive && halted) dot = "warn";
  else if (src && !alive) dot = "bad";

  return (
    <div className="panel">
      <h2>
        <span className={"dot " + dot} />
        Session now
        <span className="pill" style={{marginLeft:10}}>
          {usingLocal ? "local live" : cloud ? "cloud (sanitized)" : "offline"}
        </span>
      </h2>
      {!src && (
        <p className="muted" style={{margin:0}}>
          No live status yet. On the trading PC start <code>Magis SPX 0DTE Status API</code>
          {" "}and <code>Magis SPX 0DTE Status Publish</code>, or run
          {" "}<code>.\scripts\run_session_status_server.ps1</code>.
        </p>
      )}
      {src && !usingLocal && cloud && (
        <p className="sub" style={{margin:"0 0 10px"}}>
          Viewing published cloud metrics (gist; refreshed about every 5 minutes from the trading PC).
          {" "}Status age: <code>{ageLabel(src.generated_at || src.heartbeat_ts)}</code>.
          {" "}Full executor stdout is only on the trading PC at <code>http://127.0.0.1:5500/</code>.
          {localErr && isHttpsPage ? <> Local API unreachable from this browser ({localErr}).</> : null}
        </p>
      )}
      {src && (
        <>
          <div className="cards" style={{marginBottom:12}}>
            <div className="card"><div className="k">Date</div><div className="v" style={{fontSize:16}}>{src.date || "–"}</div></div>
            <div className="card"><div className="k">Executor</div><div className="v" style={{fontSize:16}}>{alive ? "alive" : "down"}</div></div>
            <div className="card"><div className="k">Execution</div><div className="v" style={{fontSize:16}}>{executionLabel(src.execution_type)}</div></div>
            <div className="card"><div className="k">Open</div><div className="v">{src.open_count ?? "–"}</div></div>
            <div className="card"><div className="k">Contracts traded</div><div className="v">{src.contracts_traded ?? MISSING}</div></div>
            <div className="card"><div className="k">Session P&amp;L</div><div className={"v " + cls(src.total_pnl)}>{src.total_pnl==null?MISSING:fmt$(src.total_pnl)}</div></div>
            <div className="card"><div className="k">Realized (closed)</div><div className={"v " + cls(src.closed_pnl)}>{src.closed_pnl==null?MISSING:fmt$(src.closed_pnl)}</div></div>
            <div className="card"><div className="k">Marked (open book)</div><div className={"v " + cls(src.marked_pnl)}>{fmt$(src.marked_pnl || 0)}</div></div>
            <div className="card"><div className="k">Max loss (no stop)</div><div className="v neg">{risk.max_loss_no_stop==null?MISSING:fmt$(risk.max_loss_no_stop)}</div></div>
            <div className="card"><div className="k">Planned stop loss*</div><div className="v neg">{risk.planned_stop_loss==null?MISSING:fmt$(risk.planned_stop_loss)}</div></div>
            <div className="card"><div className="k">Defined-risk margin</div><div className="v">{risk.defined_risk_margin==null?MISSING:fmt$(risk.defined_risk_margin)}</div></div>
            <div className="card"><div className="k">Marked return / margin</div><div className={"v "+cls(risk.marked_return_on_margin_pct)}>{risk.marked_return_on_margin_pct==null?MISSING:fmtPct(risk.marked_return_on_margin_pct)}</div></div>
            <div className="card"><div className="k">Halted</div><div className="v">{halted ? <span className="pill halt">Yes</span> : "No"}</div></div>
            <div className="card"><div className="k">Flattened</div><div className="v">{flat ? <span className="pill halt">Yes</span> : "No"}</div></div>
            {src.last_tranche && src.last_tranche.skew_z != null && (()=>{
              const GATE = 0.65;
              const z = Number(src.last_tranche.skew_z);
              const dist = GATE - Math.abs(z);
              const nearGate = dist <= 0.10;
              const side = z <= -GATE ? "bull_put blocked" : (z >= GATE ? "bear_call blocked" : (dist<=0.10 ? "near gate" : "both sides open"));
              return (
                <div className="card"><div className="k">Skew z (last tranche)</div>
                  <div className={"v" + (nearGate ? " neg" : "")} style={{fontSize:16}}>{z.toFixed(2)}</div>
                  <div className="sub">{side} · gate ±{GATE}</div>
                </div>
              );
            })()}
            <div className="card"><div className="k">Heartbeat</div><div className="v" style={{fontSize:15}}>{ageLabel(src.heartbeat_ts)}</div></div>
            <div className="card"><div className="k">Status as of</div><div className="v" style={{fontSize:15}}>{ageLabel(src.generated_at || src.heartbeat_ts)}</div></div>
          </div>
          {!riskAvailable && <p className="sub" style={{margin:"0 0 10px"}}>
            Risk metrics will appear after the executor and local status service restart on the risk-ledger version.
          </p>}
          {risk.defined_risk_margin != null && <p className="sub" style={{margin:"0 0 10px"}}>
            *Stop-loss estimate assumes the short cover fills at its trigger and the retained long wing expires worthless; it is not a guaranteed loss cap. Mark quality: <code>{risk.mark_quality||MISSING}</code>.
          </p>}
          {riskHistory.length > 0 && <div style={{marginBottom:12}}>
            <div className="muted" style={{marginBottom:6, fontSize:11, textTransform:"uppercase"}}>Daily marked return on margin</div>
            <table><thead><tr><th>Date</th><th>Execution</th><th>Session P&amp;L</th><th>Realized</th><th>Marked</th><th>Margin</th><th>ROM</th><th>Max loss</th></tr></thead>
              <tbody>{riskHistory.slice(-10).reverse().map((row,i)=><tr key={i}>
                <td>{row.date}</td><td><span className="pill">{executionLabel(row.execution_type)}</span></td>
                <td className={cls(row.total_pnl)}>{row.total_pnl==null?MISSING:fmt$(row.total_pnl)}</td>
                <td className={cls(row.closed_pnl)}>{row.closed_pnl==null?MISSING:fmt$(row.closed_pnl)}</td>
                <td className={cls(row.marked_pnl)}>{fmt$(row.marked_pnl)}</td><td>{fmt$(row.defined_risk_margin)}</td>
                <td className={cls(row.marked_return_on_margin_pct)}>{fmtPct(row.marked_return_on_margin_pct)}</td><td className="neg">{fmt$(row.max_loss_no_stop)}</td>
              </tr>)}</tbody>
            </table>
            <p className="sub" style={{margin:"8px 0 0"}}>Session P&amp;L = realized on spreads closed out + mark on whatever is still open. Marked-only columns read 0 for a day that ended flat, which is why realized is shown separately; 0DTE positions settle after the session.</p>
          </div>}
          {src.config && (
            <div style={{marginTop:16}}>
              <div className="muted" style={{marginBottom:6, fontSize:11, textTransform:"uppercase"}}>Live config</div>
              <div className="cards">
                <div className="card"><div className="k">Profile</div><div className="v" style={{fontSize:14}}>{src.config.profile || MISSING}</div></div>
                <div className="card"><div className="k">Mode</div><div className="v" style={{fontSize:14}}>{src.config.mode || MISSING}{src.config.allow_live === false ? " (live disabled)" : ""}</div></div>
                <div className="card"><div className="k">Equity ref</div><div className="v">{src.config.account_equity==null?MISSING:fmt$(src.config.account_equity)}</div></div>
                <div className="card"><div className="k">Contracts / tranche</div><div className="v">{src.config.contracts_per_tranche ?? MISSING}{src.config.max_contracts_per_tranche!=null?` (max ${src.config.max_contracts_per_tranche})`:""}</div></div>
                <div className="card"><div className="k">Put / call wing</div><div className="v">{src.config.put_wing_width ?? MISSING} / {src.config.call_wing_width ?? MISSING}</div></div>
                <div className="card"><div className="k">Stop / confirm</div><div className="v">{src.config.stop_multiple ?? MISSING}x · {src.config.stop_confirm_seconds ?? MISSING}s</div></div>
                <div className="card"><div className="k">Native STP backstop</div><div className="v">{src.config.native_stop_multiple ?? MISSING}x</div></div>
                <div className="card"><div className="k">Same-side cooldown</div><div className="v">{src.config.same_side_stop_cooldown_minutes ?? MISSING}min</div></div>
                <div className="card"><div className="k">Daily halt / flatten</div><div className="v neg">{src.config.daily_loss_limit_pct!=null?fmtPct(src.config.daily_loss_limit_pct*100):MISSING} / {src.config.flatten_loss_limit_pct!=null?fmtPct(src.config.flatten_loss_limit_pct*100):MISSING}</div></div>
                <div className="card"><div className="k">VIX skip / elevated</div><div className="v">{"> "}{src.config.vix_skip_open_above ?? MISSING} skip · {src.config.vix_elevated_min ?? "–"}–{src.config.vix_elevated_max ?? "–"} @ {src.config.vix_elevated_scale ?? "–"}x</div></div>

function yearAxisTicks(sortedDates) {
  const ticks = [];
  let lastYear = "";
  for (const d of sortedDates) {
    const y = String(d).slice(0, 4);
    if (y && y !== lastYear) {
      ticks.push({ x: d, label: y });
      lastYear = y;
    }
  }
  return ticks;
}

function LineChart({series, height=320, yLabel="Cumulative P&L ($)", formatY=fmt$}) {
  // series: [{name, color, points:[{x:dateStr, y:number}]}]
  const pad = {l:64,r:16,t:16,b:48};
  const W=900, H=height;
  const all = series.flatMap(s=>s.points);
  if(!all.length) return <div className="muted">No data.</div>;
  const xs = [...new Set(all.map(p=>p.x))].sort();
  const xi = Object.fromEntries(xs.map((x,i)=>[x,i]));
  const ys = all.map(p=>p.y);
  let ymin=Math.min(0,...ys), ymax=Math.max(0,...ys);
  if(ymin===ymax){ymax=ymin+1;}
  const xToPx = (x)=> pad.l + (xs.length<=1?0:(xi[x]/(xs.length-1))*(W-pad.l-pad.r));
  const yToPx = (y)=> pad.t + (1-(y-ymin)/(ymax-ymin))*(H-pad.t-pad.b);
  const ticks = 5;
  const yticks = Array.from({length:ticks+1},(_,i)=>ymin+(i/ticks)*(ymax-ymin));
  const xticks = yearAxisTicks(xs);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:H}}>
      {yticks.map((yt,i)=>(
        <g key={i}>
          <line x1={pad.l} x2={W-pad.r} y1={yToPx(yt)} y2={yToPx(yt)} stroke="#243245" strokeWidth="1"/>
          <text x={pad.l-8} y={yToPx(yt)+4} fill="#8aa0bd" fontSize="11" textAnchor="end">{formatY(yt)}</text>
        </g>
      ))}
      {xticks.map((t,i)=>(
        <g key={i}>
          <line x1={xToPx(t.x)} x2={xToPx(t.x)} y1={H-pad.b} y2={H-pad.b+4} stroke="#3a4a5e" strokeWidth="1"/>
          <text x={xToPx(t.x)} y={H-8} fill="#8aa0bd" fontSize="11" textAnchor="middle" fontWeight="600">{t.label}</text>
        </g>
      ))}
      {series.map((s,si)=>{
        const d = s.points.map((p,i)=>`${i===0?"M":"L"}${xToPx(p.x)},${yToPx(p.y)}`).join(" ");
        return <path key={si} d={d} fill="none" stroke={s.color} strokeWidth="2"/>;
      })}
    </svg>
  );
}

function BarChart({data, height=260}) {
  // data: [{x, y}]
  const pad={l:64,r:16,t:16,b:48}; const W=900,H=height;
  if(!data.length) return <div className="muted">No data.</div>;
  const xs = data.map(d=>d.x);
  const ys=data.map(d=>d.y); let ymin=Math.min(0,...ys), ymax=Math.max(0,...ys);
  if(ymin===ymax) ymax=ymin+1;
  const bw=(W-pad.l-pad.r)/data.length*0.7;
  const xToPx=(i)=> pad.l + (i+0.5)/data.length*(W-pad.l-pad.r);
  const yToPx=(y)=> pad.t + (1-(y-ymin)/(ymax-ymin))*(H-pad.t-pad.b);
  const zero=yToPx(0);
  const xticks = yearAxisTicks(xs);
  const dateIndex = Object.fromEntries(xs.map((d,i)=>[d,i]));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:H}}>
      <line x1={pad.l} x2={W-pad.r} y1={zero} y2={zero} stroke="#3a4a5e"/>
      {data.map((d,i)=>{
        const y=yToPx(d.y);
        return <g key={i}>
          <rect x={xToPx(i)-bw/2} y={Math.min(y,zero)} width={bw} height={Math.abs(y-zero)} fill={d.y>=0?"#3fb950":"#f85149"} opacity="0.85"/>
        </g>;
      })}
      {xticks.map((t,i)=>(
        <g key={i}>
          <line x1={xToPx(dateIndex[t.x])} x2={xToPx(dateIndex[t.x])} y1={H-pad.b} y2={H-pad.b+4} stroke="#3a4a5e" strokeWidth="1"/>
          <text x={xToPx(dateIndex[t.x])} y={H-8} fill="#8aa0bd" fontSize="11" textAnchor="middle" fontWeight="600">{t.label}</text>
        </g>
      ))}
    </svg>
  );
}

function monthKeysBetween(runs){
  const dates = runs.flatMap(r=>r.daily.map(d=>d.date)).filter(Boolean).sort();
  if(!dates.length) return [];
  const set=new Set(dates.map(d=>d.slice(0,7)));
  return [...set].sort();
}

function BenchmarkPanel({data}) {
  const mbh = data.mbh_benchmark.monthly||{};
  const run = data.runs[0];
  if(!run) return null;
  // Monthly strategy return = sum daily net / equity (simple) for that month.
  const byMonth={};
  run.daily.forEach(d=>{ const m=(d.date||"").slice(0,7); if(!m) return; byMonth[m]=(byMonth[m]||0)+d.net_pnl; });
  const months = monthKeysBetween(data.runs);
  const rows = months.map(m=>{
    const stratPct = (byMonth[m]||0)/data.account_equity*100;
    const mbhPct = mbh[m]!=null? mbh[m]*100 : null;
    return {m, stratPct, mbhPct};
  });
  return (
    <div className="panel">
      <h2>Monthly: {run.label} vs MBH net (benchmark)</h2>
      <table>
        <thead><tr><th>Month</th><th>{run.label}</th><th>MBH net</th><th>Gap</th></tr></thead>
        <tbody>{rows.map(r=>(
          <tr key={r.m}>
            <td>{r.m}</td>
            <td className={cls(r.stratPct)}>{fmtPct(r.stratPct)}</td>
            <td className={r.mbhPct==null?"muted":cls(r.mbhPct)}>{r.mbhPct==null?"–":fmtPct(r.mbhPct)}</td>
            <td className={r.mbhPct==null?"muted":cls(r.stratPct-r.mbhPct)}>{r.mbhPct==null?"–":fmtPct(r.stratPct-r.mbhPct)}</td>
          </tr>
        ))}</tbody>
      </table>
      <p className="sub" style={{marginTop:10}}>MBH figures are net of fees from the fund's reported monthly returns. Strategy months are simulated, pre-fee, on ${data.account_equity.toLocaleString()} equity, and only cover the validation window.</p>
    </div>
  );
}

function Daily({data}) {
  const multi = data.runs.length > 1;
  const defaultRun = data.runs.find(r=>r.id===data.primary_run_id) || data.runs[0];
  const [runId,setRunId]=useState(defaultRun?.id);
  const run = data.runs.find(r=>r.id===runId) || defaultRun;
  const [sel,setSel]=useState(null);
  const tradingDays = run? run.daily.filter(d=>d.trades>0).map(d=>d.date):[];
  const liveDays = Object.keys(data.live?.days || {}).sort();
  const dayOptions = Array.from(new Set([...tradingDays, ...liveDays])).sort();
  const day = sel || dayOptions[dayOptions.length-1] || "";
  const dayRow = run?.daily.find(d=>d.date===day);
  const trades = run?.trades_by_date?.[day]||[];
  const liveDay = data.live?.days?.[day];
  const liveEnabled = data.live_enabled !== false && Object.keys(data.live?.days || {}).length > 0;
  const recon = liveDay?.reconcile;
  const diffPaper = recon?.diff_paper_scale;
  const executionHistory = data.live?.history || [];
  const executionTotals = data.live?.totals || {};
  return (
    <div>
      {multi && (
        <div className="row">
          <label className="muted">Backtest run</label>
          <select value={runId} onChange={e=>{setRunId(e.target.value); setSel(null);}}>
            {data.runs.map(r=><option key={r.id} value={r.id}>{r.label}</option>)}
          </select>
        </div>
      )}
      <div className="row">
        <label className="muted">Trading day</label>
        <select value={day||""} onChange={e=>setSel(e.target.value)}>
          {dayOptions.map(d=><option key={d} value={d}>{d}{liveDays.includes(d)?` · ${executionLabel(data.live.days[d]?.execution_type)}`:""}</option>)}
        </select>
      </div>
      {dayRow && <div className="cards">
        <div className="card"><div className="k">Net P&L</div><div className={"v "+cls(dayRow.net_pnl)}>{fmt$(dayRow.net_pnl)}</div></div>
        <div className="card"><div className="k">Return</div><div className={"v "+cls(dayRow.return_pct)}>{fmtPct(dayRow.return_pct)}</div></div>
        <div className="card"><div className="k">Trades</div><div className="v">{dayRow.trades}</div></div>
        <div className="card"><div className="k">Stopped</div><div className="v">{dayRow.stopped}</div></div>
        <div className="card"><div className="k">Credit sold</div><div className="v">{fmt$(dayRow.gross_credit_sold)}</div></div>
        <div className="card"><div className="k">Spread margin</div><div className="v">{fmt$(dayRow.approx_spread_margin)}</div></div>
        <div className="card"><div className="k">Halted</div><div className="v">{dayRow.halted?<span className="pill halt">Yes</span>:"No"}</div></div>
      </div>}

function SignalParity({data}) {
  // Live-vs-backtest signal tracking: skew_z drives side selection through a
  // hard +/-gate, and live IV (IB modelGreeks) does not perfectly track the
  // vendor IV the baselines/backtest use. reconcile_live.py measures the
  // divergence per session; this panel makes it visible before it becomes a
  // "why is live all bear_call?" investigation.
  const hist = (data.live?.history || []).filter(r => r.skew_parity_mean_abs != null);
  if (!hist.length) return null;
  const days = data.live?.days || {};
  const lastDate = hist[hist.length-1].date;
  const gate = days[lastDate]?.reconcile?.signal_parity?.skew?.gate ?? 0.65;
  const alertBar = 0.30;
  const series = [
    {name:"mean |Δz| (day)", color:COLORS[0], points:hist.map(r=>({x:r.date,y:r.skew_parity_mean_abs}))},
    {name:"max |Δz| (day)", color:COLORS[3], points:hist.map(r=>({x:r.date,y:r.skew_parity_max_abs}))},
    {name:`alert ${alertBar}`, color:"#8a5a00", points:hist.map(r=>({x:r.date,y:alertBar}))},
    {name:`side gate ${gate}`, color:"#f85149", points:hist.map(r=>({x:r.date,y:gate}))},
  ];
  const alerts = hist.filter(r=>r.signal_parity_alert).length;
  return (
    <div className="panel">
      <h2>Signal parity — live skew_z vs backtest replay</h2>
      <p className="sub" style={{marginTop:0}}>
        Per-day tracking error of the live skew signal against the same-minute backtest replay.
        A |Δz| above the side gate ({gate}) means live and backtest could pick opposite sides
        from the same market. {alerts>0 ? <>Alert days: <span className="pill halt">{alerts}</span></> : "No alert days."}
      </p>
      <div className="legend" style={{marginBottom:10}}>
        {series.map((s,i)=>(
          <span key={i}><span className="swatch" style={{background:s.color}}></span>{s.name}</span>
        ))}
      </div>
      <LineChart series={series} height={240} yLabel="|Δ z|" formatY={(y)=>Number(y).toFixed(2)}/>
      <table style={{marginTop:12}}>
        <thead><tr><th>Date</th><th>Sides P/C</th><th>mean |Δz|</th><th>max |Δz|</th><th>Gate flips</th><th>Status</th></tr></thead>
        <tbody>{hist.slice(-10).reverse().map((row,i)=>(
          <tr key={i}>
            <td>{row.date}</td>
            <td>{row.entries_bull_put ?? 0} / {row.entries_bear_call ?? 0}</td>
            <td>{row.skew_parity_mean_abs==null?MISSING:Number(row.skew_parity_mean_abs).toFixed(2)}</td>
            <td>{row.skew_parity_max_abs==null?MISSING:Number(row.skew_parity_max_abs).toFixed(2)}</td>
            <td>{row.skew_gate_flips ?? MISSING}</td>
            <td>{row.signal_parity_alert ? <span className="pill halt">ALERT</span> : <span className="pill">ok</span>}</td>
          </tr>
        ))}</tbody>
      </table>
      <p className="sub" style={{margin:"8px 0 0"}}>
        Sides P/C = bull_put / bear_call entries. Gate flips = tranches where live and backtest
        z-scores sat on opposite sides of the ±{gate} skew gate. Source: reconcile.json signal_parity
        (all matched minutes, computed daily post-close).
      </p>
    </div>
  );
}

function TrancheParityTable({recon}) {
  const rows = recon?.tranche_signals || [];
  if (!rows.length) return null;
  const gate = recon?.signal_parity?.skew?.gate ?? 0.65;
  const flip = (lv, bt) => lv!=null && bt!=null && (((lv < -gate) !== (bt < -gate)) || ((lv > gate) !== (bt > gate)));
  return (
    <div className="panel">
      <h2>Tranche signal parity — live vs backtest replay</h2>
      <p className="sub" style={{marginTop:0}}>
        Minute-matched z-scores. Rows highlighted when live and backtest straddle the ±{gate} skew gate —
        those are minutes where side selection could have diverged.
      </p>
      <table>
        <thead><tr><th>Time</th><th>Live action</th><th>Skew live</th><th>Skew BT</th><th>Δ</th><th>Trend live</th><th>Trend BT</th><th>Δ</th></tr></thead>
        <tbody>{rows.map((r,i)=>{
          const isFlip = flip(r.live_skew_z, r.backtest_skew_z);
          return (
            <tr key={i} style={isFlip?{background:"rgba(248,81,73,0.12)"}:undefined}>
              <td>{r.time}</td>
              <td className="muted">{r.live_executed>0 ? `entry ×${r.live_executed}` : (r.live_skip || "—")}</td>
              <td>{fmtNum(r.live_skew_z,2)}</td>
              <td>{fmtNum(r.backtest_skew_z,2)}</td>
              <td className={Math.abs(r.skew_delta||0)>gate?"neg":""}>{fmtNum(r.skew_delta,2)}</td>
              <td>{fmtNum(r.live_trend_z,2)}</td>
              <td>{fmtNum(r.backtest_trend_z,2)}</td>
              <td>{fmtNum(r.trend_delta,2)}</td>
            </tr>
          );
        })}</tbody>
      </table>
    </div>
  );
}

const AUTH_KEY = "spx0dte_dashboard_auth_v1";

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function bytesToB64(bytes) {
  let s = "";
  bytes.forEach(b => { s += String.fromCharCode(b); });
  return btoa(s);
}

async function verifyInvestor(user, password) {
  const enc = new TextEncoder();
  const salt = b64ToBytes(user.salt_b64);
  const iterations = user.iterations || 250000;
  const key = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations, hash: "SHA-256" }, key, 256);
  return bytesToB64(new Uint8Array(bits)) === user.hash_b64;
}

function LoginGate({ users, onAuthed }) {
  const [userId,setUserId]=useState("");
  const [password,setPassword]=useState("");
  const [busy,setBusy]=useState(false);
  const [error,setError]=useState("");
  async function submit(e) {
    e.preventDefault();
    setError("");
    const uid = userId.trim().toLowerCase();
    const user = users.find(u => String(u.id || "").toLowerCase() === uid);
    if (!user) { setError("Invalid login."); return; }
    setBusy(true);
    try {
      const ok = await verifyInvestor(user, password);
      if (!ok) { setError("Invalid login."); return; }
      sessionStorage.setItem(AUTH_KEY, JSON.stringify({ id: user.id, name: user.name || user.id }));
      onAuthed({ id: user.id, name: user.name || user.id });
    } catch (err) {
      setError(String(err));
    } finally {
      setBusy(false);
    }
  }
  return (
    <div className="login-wrap">
      <form className="login-card" onSubmit={submit}>
        <h1 style={{margin:"0 0 8px", fontSize:18}}>SPX 0DTE Dashboard</h1>
        <p className="sub" style={{margin:"0 0 18px"}}>Sign in to view backtest results.</p>
        <div className="login-field">
          <label htmlFor="login-id">User id</label>
          <input id="login-id" value={userId} onChange={e=>setUserId(e.target.value)} autoComplete="username" />
        </div>
        <div className="login-field">
          <label htmlFor="login-pw">Password</label>
          <input id="login-pw" type="password" value={password} onChange={e=>setPassword(e.target.value)} autoComplete="current-password" />
        </div>
        <button className="login-btn" type="submit" disabled={busy}>{busy ? "Checking…" : "Sign in"}</button>
        {error ? <div className="login-error">{error}</div> : null}
      </form>
    </div>
  );
}

function App({ viewer }) {
  const [data,setData]=useState(null);
  const [tab,setTab]=useState("overview");
  const [err,setErr]=useState(null);
  useEffect(()=>{
    fetch("data/build_stamp.txt", { cache: "no-store" })
      .then(r => r.ok ? r.text() : "")
      .catch(() => "")
      .then(stamp => {
        const v = encodeURIComponent(String(stamp || "").trim());
        const url = v ? `data/dashboard_data.json?v=${v}` : "data/dashboard_data.json";
        return fetch(url, { cache: "no-store" });
      })
      .then(r => { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(setData)
      .catch(e => setErr(String(e)));
  },[]);
  if(err) return <main><div className="panel">Could not load <code>data/dashboard_data.json</code>: {err}. Run <code>python dashboard/build_dashboard_data.py</code> first.</div></main>;
  if(!data) return <main><div className="muted">Loading…</div></main>;
  const primary = data.runs.find(r=>r.id===data.primary_run_id) || data.runs[0];
  const windowLabel = primary?.meta?.date_range ? ` · ${primary.meta.date_range}` : "";
  const title = primary?.label || "SPX 0DTE Strategy Dashboard";
  return (
    <div>
      <header>
        <h1>{title}</h1>
        <span className="sub">${data.account_equity.toLocaleString()} equity{windowLabel} · built {new Date(data.generated_at).toLocaleString()}{viewer ? ` · ${viewer.name}` : ""}</span>
      </header>
      <div className="tabs">
        <div className={"tab"+(tab==="overview"?" active":"")} onClick={()=>setTab("overview")}>Overview</div>
        <div className={"tab"+(tab==="factors"?" active":"")} onClick={()=>setTab("factors")}>Market factors</div>
        <div className={"tab"+(tab==="daily"?" active":"")} onClick={()=>setTab("daily")}>Daily drill-down</div>
      </div>
      <main>
        <SessionNow />
        <ReasonReference />
        {tab==="overview"? <Overview data={data}/> : tab==="factors"? <MarketFactors data={data}/> : <Daily data={data}/>}
      </main>
    </div>
  );
}

function Root() {
  const [auth,setAuth]=useState(null);
  const [users,setUsers]=useState(null);
  const [authErr,setAuthErr]=useState(null);
  useEffect(()=>{
    const saved = sessionStorage.getItem(AUTH_KEY);
    if (saved) {
      try { setAuth(JSON.parse(saved)); } catch (_) { sessionStorage.removeItem(AUTH_KEY); }
    }
    fetch("data/investors.json")
      .then(r => r.ok ? r.json() : { version: 1, users: [] })
      .then(doc => setUsers(Array.isArray(doc.users) ? doc.users : []))
      .catch(e => setAuthErr(String(e)));
  },[]);
  if (authErr) return <main><div className="panel">Could not load login config: {authErr}</div></main>;
  if (users === null) return <main><div className="muted">Loading…</div></main>;
  if (users.length > 0 && !auth) return <LoginGate users={users} onAuthed={setAuth} />;
  return <App viewer={auth} />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
